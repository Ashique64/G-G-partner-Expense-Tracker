name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (well within Supabase's 7-day inactivity limit)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ Error: SUPABASE_URL or SUPABASE_ANON_KEY secret is not set in GitHub repository secrets."
            exit 1
          fi

          echo "Sending keep-alive request to Supabase REST API..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/expenses?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Response HTTP Status: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase project is active and successfully pinged!"
          else
            echo "❌ Ping failed with HTTP $HTTP_STATUS."
            echo "Note: If the project is currently PAUSED on Supabase, a ping cannot wake it up."
            echo "You must first unpause/restore it manually in the Supabase Dashboard."
            exit 1
          fi
